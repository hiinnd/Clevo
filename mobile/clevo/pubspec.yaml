name: clevo
description: One CLEVO application for customers, station owners and drivers.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  material_ui: ^1.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  dio: ^5.11.1
  go_router: ^18.1.4
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3
  firebase_core: ^5.2.0
  firebase_messaging: ^17.0.1
  google_maps_flutter: ^2.19.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  image_picker: ^1.2.0
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
